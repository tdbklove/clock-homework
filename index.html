<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雷明的海洋時鐘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jersey+10&family=Press+Start+2P&family=Tiny5:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root{
      --x1: 0;
      --y1: 0;
      --x2: 0;
      --y2: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tiny5', 'DotGothic16', 'Press Start 2P', 'Jersey 10', 'Tiny5', Arial, sans-serif;
    }
    
    #bg{
      width: 100vw;
      height: 100vh;
      background-image: url('./img/background.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center bottom;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #leming-run {
      background-image: url('./img/leming-run.gif');
      background-repeat: no-repeat;
      background-size: contain;
      width: calc(160px / 3);
      height: calc(160px / 3);
      position: absolute;
      transform-origin: right;
      top: calc(-160px / 6);
      left: calc(-160px / 6 - 3px);
      cursor: pointer;
    }

    .leming-jump {
      width: 150px;
      height: 150px;
      background-image: url('./img/leming-jump-wait.gif');
      background-position: bottom center;
      background-repeat: no-repeat;
      background-size: contain;
      position: absolute;
      cursor: pointer;
    }

    .leming-stretch {
      width: 160px;
      height: 240px;
      background-image: url('./img/leming-stretch-wait.gif');
      background-position: bottom center;
      background-repeat: no-repeat;
      background-size: contain;
      position: absolute;
      right: 20%;
      bottom: 8%;
      cursor: pointer;
    }
    
    #leming-fast-movement {
      width: 130px;
      height: 130px;
      background-image: url('./img/leming-fast-movement.gif');
      background-position: bottom center;
      background-repeat: no-repeat;
      background-size: contain;
      position: absolute;
      left: -130px;
      bottom: 0%;
      transition: left 60s linear;
      z-index: 6;
      cursor: pointer;
    }

    #leming-float {
      width: calc(1030px / 4);
      height: calc(1540px / 4);
      background-image: url('./img/leming-float.gif');
      background-position: bottom center;
      background-repeat: no-repeat;
      background-size: contain;
      position: absolute;
      right: -258px;
      top: 8%;
      transition: right 8s linear;
      cursor: pointer;
    }

    .runing{
      background-image: var(--runing-url, url('./img/leming-onward.gif'));
      cursor: none;
    }

    .jumping {
      background-image: url('./img/leming-jump.gif');
      background-image: var(--jumping-url, url('./img/leming-jump.gif'));
      cursor: none;
    }

    .stretching {
      background-image: var(--stretching-url, url('./img/leming-stretch.gif'));
      cursor: none;
    }

    #clock {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background-image: url('./img/clock.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 107%;
      margin: 0 auto;
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      align-content: center;
      z-index: 1;
    }

    #hour {
      width: 20%;
      height: 8px;
      background-color: #195e72;
      position: absolute;
      left: 30%;
      top: calc(50% - 4px);
      transform: rotate(0deg);
      transform-origin: right center;
      border-radius: 4px;
    }

    #minute {
      width: 40%;
      height: 6px;
      background-color: #499fa5;
      position: absolute;
      left: 10%;
      top: calc(50% - 3px);
      transform: rotate(0deg);
      transform-origin: right center;
      border-radius: 4px;
    }

    #second {
      width: 45%;
      height: 4px;
      background-color: #fd716c;
      position: absolute;
      left: 5%;
      top: calc(50% - 2px);
      transform: rotate(0deg);
      transform-origin: right center;
      border-radius: 4px;
    }

    #round {
      width: 12px;
      height: 12px;
      background-color: #011e44;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #time {
      display: block;
      width: 800px;
      height: 4rem;
      line-height: 4rem;
      text-align: center;
      font-size: 4rem;
      position: absolute;
      left: 50%;
      bottom: -5.5rem;
      transform: translateX(-50%);
      color: #FFF;
    }

    .dialog{
      border: 3px solid #000;
      background-color: #FFF;
      padding: 1rem;
      position: absolute;
      border-radius: 0.25rem;
      box-sizing: border-box;
      box-shadow: -10px -10px 0px -4px #e3e3e3 inset;
      z-index: 6;
    }
    .dialog::before{
      content: '';
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      position: absolute;
      bottom: 10px;
    }
    .dialog::after{
      content: '';
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      position: absolute;
      bottom: 13px;
    }
    .dialog.left::before{
      border-left: 20px solid #000;
      right: -20px;
    }
    .dialog.left::after{
      border-left: 15px solid #e3e3e3;
      right: -14px;
    }
    .dialog.right::before{
      border-right: 20px solid #000;
      left: -20px;
    }
    .dialog.right::after{
      border-right: 15px solid #FFF;
      left: -14px;
    }
    .dialog.top{
      white-space: nowrap;
    }
    .dialog.top::before{
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 18px solid #000;
      left: calc(50% - 13px);
      bottom: -31px;
    }
    .dialog.top::after{
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 16px solid #e3e3e3;
      left: calc(50% - 11px);
      bottom: -24px;
    }
    
    .hide{
      display: none;
    }
    .show{
      display: block;
    }

    .fish{
      width: calc(160px / 3);
      height: calc(128px / 3);
      background-image: url('./img/fish.gif');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      position: absolute;
      z-index: 0;
    }

    @keyframes swimming {
      0%{
        left: var(--x1);
        top: var(--y1);
      }
      100%{
        left: var(--x2);
        top: var(--y2);
      }
    }

    @keyframes fade {
      0%{
        opacity: 0;
      }
      15%{
        opacity: 0.8;
      }
      25%{
        opacity: 1;
      }
      75%{
        opacity: 1;
      }     
      85%{
        opacity: 0.8;
      }
      100%{
        opacity: 0;
      }
    } 
  </style>
</head>

<body>
  <div id="container">
    <div id="bg"></div>
    <div id="clock">
      <div id="minute"></div>
      <div id="hour"></div>
      <div id="second">
        <div id="leming-run" class="leming" onclick="run()"></div>
      </div>
      <div id="round"></div>
      <div id="time"></div>
    </div>
    <div id="leming-fast-movement" class="leming" onclick="dialogBox(this, movement_texts[random(0, movement_texts.length - 1)])"></div>
    <div id="leming-float" class="leming" onclick="dialogBox(this, `時間差不多了\n午餐吃 ${float_texts[random(0, float_texts.length - 1)]} 怎麼樣?`)"></div>
  </div>

  <script>
    const body = document.getElementsByTagName('body')[0];
    const hour = document.getElementById('hour');
    const minute = document.getElementById('minute');
    const second = document.getElementById('second');
    const container = document.getElementById('container');
    const time = document.getElementById('time');
    const leming = document.getElementsByClassName('leming');
    const leming_fast_movement = document.getElementById('leming-fast-movement');
    const leming_float = document.getElementById('leming-float');
    const filters = [
      { time: 5,  bg: 'brightness(0.6) hue-rotate(20deg)', leming: 'hue-rotate(20deg)'}, // 凌晨
      { time: 8,  bg: 'hue-rotate(340deg)', leming: 'hue-rotate(20deg)'}, // 清晨
      { time: 17, bg: 'hue-rotate(0deg)', leming: 'hue-rotate(0deg)' }, // 早上
      { time: 19, bg: 'hue-rotate(200deg)', leming: 'hue-rotate(200deg)' }, // 黃昏
      { time: 24, bg: 'brightness(0.6) hue-rotate(20deg)', leming: 'hue-rotate(20deg)'}, // 晚上
    ];
    let time_period = 4;
    const dialog_w = 180;
    const float_texts = [
      '豬肉湯飯',
      '蔘雞湯',
      '刀削麵',
      '大醬湯',
      '韓牛燒肉',
      '泡菜豆腐湯',
      '牛肉海帶湯',
      '韓式部隊鍋',
    ];
    const movement_texts = [
      '■ ■■■ ■■■ 大人',
      '大人...工程師先生......',
    ];
    const stretch_texts = [
      '無可奉告\n哺乳動物們！',
      '您有沒有聽說過\n有人評價您很有同情心呢?',
      '我果然是個天才\n到底要優秀到什麼程度才甘心',
      '...我...我是...\n...我，沒有錯...',
      '魔法用的好\n魔法道具也做得好\n現在連藥劑製作都能行',
      '首席工程師\n這位人物...\n是那顆星球上僅存的最後一絲同理心',
      '這群笨蛋\n沒我就等著完蛋\n終於辭職了!!!',
      '自以為是地當個大魔導士，結果到底有多蠢...!',
      '我施展魔法的速度\n比地球上任何人都要快',
      '請問在這個星球上\n未經同意讀取逝者記憶的行為是否犯法?',
      '我可是阿爾法烏里的第一大魔導士 ▒▒',
      '在受傷前讓開\n總統直屬的高級官員要過去了',
    ];

    // 隨機數字
    function random(min, max) {
      const num = Math.round(Math.random() * (max - min)) + min;
      return num;
    }

    // 點擊雷明觸發對話框
    function dialogBox(el, text){
      const _this = el;

      if (!_this.classList.contains('runing') && !_this.classList.contains('stretching')) {
        
        const dialog = document.createElement('div');
        dialog.classList.add('dialog');
        dialog.innerText = text?? '■ ■■■ ■■■';

        // 禁用點擊
        _this.style.pointerEvents = 'none';

        if(_this.classList.contains('leming-stretch')){
          _this.style.setProperty('--stretching-url', `url('./img/leming-stretch.gif?t=${Date.now()}')`);
          _this.classList.add('stretching');

          // 設定對話框尺寸方位
          dialog.style.width = `${dialog_w}px`;
          dialog.style.top = `${_this.offsetHeight / 6}px`;
          
          if((_this.offsetLeft - dialog_w) < 0){
            dialog.classList.remove('left');
            dialog.classList.add('right');
            dialog.style.left = 'auto';
            dialog.style.right = `${- dialog_w}px`;
          } else {
            dialog.classList.remove('right');
            dialog.classList.add('left');
            dialog.style.right = 'auto';
            dialog.style.left = `${- dialog_w}px`;
          }

          const lemingTimer = setTimeout(() => {
            _this.append(dialog);
            const timer =  setTimeout(() => {
              dialog.remove();
              _this.classList.remove('stretching');
              _this.style.pointerEvents = 'auto';
              clearTimeout(timer);
            }, 6500);
            clearTimeout(lemingTimer);
          }, 1500);
  
        }
        
        if(_this.id === 'leming-fast-movement'){
          // 設定對話框尺寸方位
          dialog.style.width = 'auto';
          dialog.style.top = '-60px';
          dialog.style.left = '50%'
          dialog.classList.add('top');
          if (_this.style.transform === 'rotateY(180deg)'){
            dialog.style.transform = 'translateX(-50%) rotateY(180deg)';
          } else {
            dialog.style.transform = 'translateX(-50%)';
          }
          _this.append(dialog);

          const timer =  setTimeout(() => {
            dialog.remove();
            _this.style.pointerEvents = 'auto';
            clearTimeout(timer);
          }, 3000);
        }

        if(_this.id === 'leming-float'){
          // 設定對話框尺寸方位
          dialog.style.width = `${dialog_w}px`;
          dialog.style.top = `${_this.offsetHeight / 6}px`;
          dialog.style.left = `${- dialog_w}px`;
          dialog.classList.add('left');
          _this.append(dialog);

          const timer =  setTimeout(() => {
            dialog.remove();
            _this.style.pointerEvents = 'auto';
            clearTimeout(timer);
          }, 3000);
        }
      }      
    }

    // 點擊彈跳雷明觸發動畫
    function jump(el) {
      const _this = el;

      // 如果雷明是等待狀態且並非在移動中會觸發
      if (!_this.classList.contains('runing') && !_this.classList.contains('jumping')) {

        // 跳躍中禁用點擊
        _this.style.pointerEvents = 'none';
        _this.style.setProperty('--jumping-url', `url('./img/leming-jump.gif?t=${Date.now()}')`);
        _this.classList.add('jumping');
        
        const lemingTimer = setTimeout(() => {
          _this.classList.remove('jumping');
          _this.style.pointerEvents = 'auto';
          clearTimeout(lemingTimer);
        }, 8000);
      }
    }

    // 點擊秒針的跑動小雷明會出現跑動雷明越過畫面
    let count = 0;
    function run(){      
      count++;
      
      if(count%2 === 0){
        leming_fast_movement.style.left = '-130px';
        leming_fast_movement.style.transform = 'rotateY(180deg)';
      } else {
        leming_fast_movement.style.left = '100%';
        leming_fast_movement.style.transform = 'rotateY(0deg)';
      }
    }

    // 隨機移動
    function randomMovement(id){
      const leming = document.getElementById(id);

      // 如果被選中的雷明移動中就 return
      if (leming.classList.contains('runing') || leming.classList.contains('jumping') || leming.classList.contains('stretching')) return;
      
      // 隨機決定雷明移動距離 ( 不可超出內容寬度 )
      const left = leming.offsetLeft;
      const new_left = random(0, (container.clientWidth - leming.offsetWidth));
      
      // 如果位置沒有移動就 return
      if (new_left === left) return;
      
      // 改為移動時的 gif
      leming.style.setProperty('--runing-url', `url('./img/leming-onward.gif?t=${Date.now()}')`);
      leming.classList.add('runing');

      // 依照雷明移動方向翻轉圖片
      if(new_left - left < 0) leming.style.transform = 'rotateY(180deg)';
      
      if (leming.classList.contains('leming-stretch')) leming.style.width = '145px';
      
      leming.style.left = new_left + 'px';
      leming.style.transition = `left 20s linear`;      

      const lemingTimer = setTimeout(() => {
        leming.classList.remove('runing');
        leming.style.transform = 'rotateY(0deg)';
        if (leming.classList.contains('leming-stretch')) leming.style.width = '160px';
        clearTimeout(lemingTimer);
      }, 20000);
    }
    
    // 背景顏色隨時間變化
    function timeFilter(h) {
      const time_index = filters.findIndex((val) => {
        return h < val.time
      });

      if(time_index === time_period) return;
      
      body.style.filter = filters[time_index].bg;
      for(const el of leming){
        el.style.filter = filters[time_index].leming;
      }

      time_period = time_index;
    }

    // 隨機放置 5 個雷明
    let stretch = random(2, 5);
    // 雷明的陣列
    const lemings = [];
    for (let i = 1; i <= 5; i++) {
      let div = document.createElement('div');
      // 把雷明的 id 放入陣列
      div.id = `leming-${i}`;
      lemings.push(div.id);
      div.classList.add('leming');
      
      if (i !== stretch) {
        div.classList.add('leming-jump');
        div.style.width = random(120, 150) + 'px';
        div.onclick = function () {
          jump(this);
        };
      } else {
        div.classList.add('leming-stretch');
        div.addEventListener('click', () => {
          dialogBox(div, stretch_texts[random(0, stretch_texts.length - 1)]);
        });
      }
      
      div.style.left = (15 * i) + '%';
      div.style.bottom = random(2, 13) + '%';

      container.append(div);
    }

    // 依照距離遠近排序雷明陣列
    lemings.sort((a, b) => {
      const bottom_a = (document.getElementById(a).style.bottom.replace('%', ''))*1;
      const bottom_b = (document.getElementById(b).style.bottom.replace('%', ''))*1;
      return bottom_b - bottom_a;
    });

    // 越靠近底部的雷明 z-index 越大
    lemings.map((id, i) => {
      document.getElementById(id).style.zIndex = i + 1;
    });
    
    // 每 10 秒移動一隻雷明
    setInterval(() => {
      const no_ing = lemings.filter((leming) => {
        const run = !document.getElementById(leming).classList.contains('runing');
        const jump = !document.getElementById(leming).classList.contains('jumping');
        const stretch = !document.getElementById(leming).classList.contains('stretching');
        return (run && jump && stretch);
      });
      if (no_ing.length === 0) return;
      randomMovement(no_ing[random(0, (no_ing.length - 1))]);
    } ,10000);
    randomMovement(lemings[random(0, (lemings.length - 1))]);

    // 隨機生成背景魚群游動
    for(let i = 0; i <= random(3, 5); i++){
      let fish = document.createElement('div');
      fish.classList.add('fish');

      let x_old = 0;
      let x_new = 0;
      let time_s = 60;
      for(let i = 1; i <= 2; i++){
        x_new = random(0, 100);
        time_s = random(20, 40);
        fish.style.setProperty(`--x${i}`, `${x_new}%`);
        fish.style.setProperty(`--y${i}`, `${random(0, 70)}%`);
        fish.style.transform = (x_new < x_old)? 'rotateY(180deg)' : 'rotateY(0deg)';
        fish.style.animation = `swimming ${time_s}s ease-in-out infinite, fade ${time_s}s infinite`;
        x_old = x_new;
      }
      container.append(fish);
    }

    // 雷明是否進入畫面
    let leming_in = false;
    const clock = () => {
      const date = new Date();
      const h = date.getHours();
      const m = date.getMinutes();
      const s = date.getSeconds();
      const am_pm = date.toLocaleTimeString('en-US').toString().split(' ')[1];
      const t12 = date.toLocaleTimeString('en-US').toString().split(' ')[0].split(':');

      hour.style.transform = `rotate(${h * (360 / 12) + 90}deg)`;
      minute.style.transform = `rotate(${m * (360 / 60) + 90}deg)`;
      second.style.transform = `rotate(${s * (360 / 60) + 90}deg)`;

      time.innerText = `${t12[0].toString().padStart(2, '0')}：${t12[1].toString().padStart(2, '0')}：${t12[2].toString().padStart(2, '0')} ${am_pm}`;

      // 每到中午 12 點金技勵要出來打招呼
      if (h === 12 && m < 30 && leming_in === false) {
        leming_in = true;
        leming_float.style.right = '2%';
        leming_float.style.pointerEvents = 'none';
        const timer = setTimeout(() => {
          dialogBox(leming_float, '我們去吃午餐吧！');
          clearTimeout(timer);
        }, 7000);
      }
      // 半小時後離場
      if (h === 12 && m >= 30 && leming_in === true) {
        leming_in = false;
        leming_float.style.right = '-258px';
      }

      timeFilter(h);
    }
    setInterval(clock, 1000);
    clock();
  </script>
</body>
</html>
